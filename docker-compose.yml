version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gtc_db
    environment:
      POSTGRES_USER: gtc_user
      POSTGRES_PASSWORD: gtc_password
      POSTGRES_DB: gtc_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://gtc_user:gtc_password@db:5432/gtc_db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
